name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 権限はジョブごとに最小限だけ与える。
# npm ci を走らせる build に本番デプロイ権限を持たせない
permissions:
  contents: read

# 同時に走らないようにする（デプロイ中の実行はキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # package.json の build を使う。
      # ここで直接 eleventy を叩くと、手元と本番で手順がずれる
      # （clean と ELEVENTY_ENV=production は build 側に入っている）
      - name: Build with Eleventy
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
